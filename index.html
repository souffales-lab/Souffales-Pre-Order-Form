<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Souffales Pre-Order Merchandise Form ✨</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-cream: #FFFDF7;
            --card-bg: #FFFFFF;
            --brown-text: #785A46;
            --brown-dark: #5C4333;
            --brown-btn: #A0785C;
            --brown-btn-hover: #8A644A;
            --border-solid: #EFE4D3;
            --radius-xl: 20px;
            --radius-md: 10px;
            --highlight: #FDE8AF;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Quicksand', sans-serif; background-color: var(--bg-cream); color: var(--brown-text); padding: 20px; }
        .container { max-width: 650px; margin: 0 auto; background: var(--card-bg); border: 2px solid var(--border-solid); border-radius: var(--radius-xl); padding: 24px; box-shadow: 0 4px 16px rgba(120,90,70,0.05); }
        h1 { font-family: 'Fredoka', cursive; color: var(--brown-dark); text-align: center; margin-bottom: 8px; }
        p.subtitle { text-align: center; font-size: 0.9rem; margin-bottom: 24px; font-weight: 600; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-family: 'Fredoka', cursive; font-size: 0.9rem; margin-bottom: 6px; color: var(--brown-dark); }
        input[type="text"], input[type="email"], textarea, select { width: 100%; padding: 10px 14px; border-radius: var(--radius-md); border: 2px solid var(--border-solid); font-family: 'Quicksand', sans-serif; font-weight: 600; outline: none; background: #FFFDF0; color: var(--brown-dark); }
        textarea { resize: vertical; height: 80px; }
        
        /* Merch Card & Catalog Styles */
        .fandom-title { font-family: 'Fredoka', cursive; font-size: 1.4rem; color: var(--brown-btn); border-bottom: 2px dashed var(--border-solid); padding-bottom: 5px; margin: 30px 0 15px; }
        .merch-card { background: #FFFDF9; border: 2px solid var(--border-solid); border-radius: var(--radius-xl); padding: 16px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(120,90,70,0.03); }
        .katalog-img { width: 100%; border-radius: var(--radius-md); border: 2px solid var(--border-solid); margin-bottom: 12px; display: block; }
        .merch-header { font-family: 'Fredoka', cursive; font-size: 1.1rem; color: var(--brown-dark); }
        .merch-price { font-size: 0.9rem; font-weight: bold; color: #9A7A60; margin-bottom: 12px; display: block; }
        
        /* Counter Control Styling (- [ 0 ] +) */
        .counter-container { display: flex; align-items: center; justify-content: space-between; background: #FFFDF0; border: 2px solid var(--border-solid); border-radius: var(--radius-md); padding: 8px 14px; margin-top: 8px; }
        .counter-label { font-family: 'Fredoka', cursive; font-size: 0.9rem; color: var(--brown-dark); }
        .counter-controls { display: flex; align-items: center; gap: 12px; }
        .counter-btn { background: var(--card-bg); border: 2px solid var(--border-solid); color: var(--brown-dark); font-family: 'Fredoka', cursive; font-size: 1rem; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .counter-btn:hover { background: var(--brown-btn); color: #fff; border-color: var(--brown-btn); }
        .counter-value { font-family: 'Fredoka', cursive; font-size: 1.1rem; min-width: 24px; text-align: center; color: var(--brown-dark); }

        .total-box { position: sticky; bottom: 10px; z-index: 100; font-family: 'Fredoka', cursive; font-size: 1.1rem; background: var(--highlight); padding: 14px; border-radius: var(--radius-md); text-align: center; margin: 20px 0; color: var(--brown-dark); box-shadow: 0 4px 10px rgba(0,0,0,0.1); border: 2px solid #F6D888;}
        .btn { background: var(--brown-btn); color: #fff; border: none; width: 100%; padding: 14px; border-radius: var(--radius-md); font-family: 'Fredoka', cursive; font-size: 1rem; cursor: pointer; box-shadow: 0 4px 0 var(--brown-dark); }
        .btn:hover { background: var(--brown-btn-hover); }
        input[type="file"] { padding: 8px; background: #FFFDF0; border: 2px dashed var(--border-solid); border-radius: var(--radius-md); width: 100%; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h1>Pre-Order by @Souffales</h1>
    <p class="subtitle">Silakan isi formulir dan atur jumlah pesanan merch incaranmu!</p>

    <form id="orderForm">
        <!-- FORM DATA DIRI -->
        <div class="form-group">
            <label>Nama *</label>
            <input type="text" id="nama" required placeholder="Nama pemesan">
        </div>
        <div class="form-group">
            <label>Email *</label>
            <input type="email" id="email" required placeholder="email@domain.com">
        </div>
        <div class="form-group">
            <label>No. HP *</label>
            <input type="text" id="hp" required placeholder="08xxxxxxxxxx">
        </div>
        <div class="form-group">
            <label>Sosial Media (Twitter/IG/Discord) *</label>
            <input type="text" id="sosmed" required placeholder="@username">
        </div>
        <div class="form-group">
            <label>Metode Pengambilan *</label>
            <select id="metodePengambilan" required>
                <option value="">-- Pilih Metode Pengambilan --</option>
                <option value="Pickup Event">Pickup CF Day 1</option>
                <option value="Pickup Event">Pickup CF Day 2</option>
                <option value="Mail Order">Mail Order (Lion Parcel)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Alamat Pengiriman (Jika memilih Mail Order)</label>
            <textarea id="alamat" placeholder="Nama jalan, kecamatan, kota, kode pos"></textarea>
        </div>

        <!-- =================== FANDOM: GENSHIN IMPACT =================== -->
        <h2 class="fandom-title">Genshin Impact</h2>
        
        <!-- KATALOG ITEM 1: KOTSOUNA -->
        <div class="merch-card">
            <!-- Ganti link src dengan foto katalog Kotsouna-mu -->
            <img src="https://via.placeholder.com/600x350/FFFDF0/785A46?text=Katalog+Kotsouna+Genshin" alt="Katalog Kotsouna" class="katalog-img">
            <div class="merch-header">Genshin Kotsouna</div>
            <span class="merch-price">Rp 45.000 / $7</span>
            
            <div id="kotsouna-genshin-list">
                <!-- Counter item di-generate otomatis via JS -->
            </div>
        </div>

        <!-- KATALOG ITEM 2: STICKER -->
        <div class="merch-card">
            <!-- Ganti link src dengan foto katalog Sticker-mu -->
            <img src="https://via.placeholder.com/600x350/FFFDF0/785A46?text=Katalog+Sticker+Genshin" alt="Katalog Sticker" class="katalog-img">
            <div class="merch-header">Genshin Sticker</div>
            <span class="merch-price">Rp 8.000 / $1.50</span>
            
            <div id="sticker-genshin-list">
                <!-- Counter item di-generate otomatis via JS -->
            </div>
        </div>

        <!-- CATATAN -->
        <div class="form-group" style="margin-top: 16px;">
            <label>Masukkan catatan untuk kami!</label>
            <input type="text" id="catatanPesanan" placeholder="Misal: Link Google Drive list pesanan / catatan khusus">
        </div>

        <!-- FLOATING TOTAL BAR -->
        <div class="total-box">
            Total Estimasi: <span id="totalDisplay">Rp 0</span>
        </div>

        <div class="form-group">
            <label>Upload bukti pembayaran disini *</label>
            <input type="file" id="buktiBayar" accept="image/*" required>
        </div>

        <button type="submit" class="btn" id="submitBtn">✨ Kirim Pesanan </button>
    </form>
</div>

<script>
    // URL WEB APP GOOGLE SCRIPT
    const SCRIPT_URL = "MASUKKAN_URL_WEB_APP_GOOGLE_SCRIPT_DISINI";

    // --- DATA KARAKTER PER KATALOG ---
    const kotsounaChars = ["Karakter 1", "Karakter 2", "Karakter 3"];
    const stickerChars = ["Set Karakter A", "Set Karakter B"];

    // Fungsi untuk membuat baris counter (-) (angka) (+)
    function generateCounters(containerId, charList, itemName, price) {
        const container = document.getElementById(containerId);
        charList.forEach((char, index) => {
            const row = document.createElement('div');
            row.className = 'counter-container';

            const label = document.createElement('span');
            label.className = 'counter-label';
            label.innerText = char;

            const controls = document.createElement('div');
            controls.className = 'counter-controls';

            const btnMinus = document.createElement('button');
            btnMinus.type = 'button';
            btnMinus.className = 'counter-btn';
            btnMinus.innerText = '-';

            const valueSpan = document.createElement('span');
            valueSpan.className = 'counter-value';
            valueSpan.id = `${containerId}-qty-${index}`;
            valueSpan.innerText = '0';
            valueSpan.dataset.price = price;
            valueSpan.dataset.itemName = `${itemName} - ${char}`;

            const btnPlus = document.createElement('button');
            btnPlus.type = 'button';
            btnPlus.className = 'counter-btn';
            btnPlus.innerText = '+';

            // Logika Tombol Plus (+)
            btnPlus.addEventListener('click', function() {
                let currentVal = parseInt(valueSpan.innerText);
                valueSpan.innerText = currentVal + 1;
                calculateTotal();
            });

            // Logika Tombol Minus (-)
            btnMinus.addEventListener('click', function() {
                let currentVal = parseInt(valueSpan.innerText);
                if (currentVal > 0) {
                    valueSpan.innerText = currentVal - 1;
                    calculateTotal();
                }
            });

            controls.appendChild(btnMinus);
            controls.appendChild(valueSpan);
            controls.appendChild(btnPlus);

            row.appendChild(label);
            row.appendChild(controls);
            container.appendChild(row);
        });
    }

    // Panggil fungsi render counter untuk masing-masing merch
    generateCounters('kotsouna-genshin-list', kotsounaChars, 'Genshin Kotsouna', 45000);
    generateCounters('sticker-genshin-list', stickerChars, 'Genshin Sticker', 8000);

    // --- LOGIKA HITUNG TOTAL ---
    const totalDisplay = document.getElementById('totalDisplay');

    function calculateTotal() {
        let total = 0;
        const allValues = document.querySelectorAll('.counter-value');
        allValues.forEach(el => {
            const qty = parseInt(el.innerText);
            const price = parseInt(el.dataset.price);
            total += qty * price;
        });
        totalDisplay.innerText = "Rp " + total.toLocaleString('id-ID');
    }

    // --- LOGIKA SUBMIT FORM ---
    document.getElementById('orderForm').addEventListener('submit', function(e) {
        e.preventDefault();

        // Cek total harga
        let total = 0;
        let detailsArr = [];
        const allValues = document.querySelectorAll('.counter-value');
        allValues.forEach(el => {
            const qty = parseInt(el.innerText);
            if (qty > 0) {
                const price = parseInt(el.dataset.price);
                total += qty * price;
                detailsArr.push(`${el.dataset.itemName} (x${qty})`);
            }
        });

        if (total === 0) {
            alert("Harap pilih minimal 1 merchandise terlebih dahulu!");
            return;
        }

        const fileInput = document.getElementById('buktiBayar');
        const file = fileInput.files[0];
        if (!file) {
            alert("Harap upload bukti pembayaran!");
            return;
        }

        let finalDetailStr = detailsArr.join(', ');
        const catatan = document.getElementById('catatanPesanan').value.trim();
        if (catatan) {
            finalDetailStr += ` | Catatan/Link: ${catatan}`;
        }

        const btn = document.getElementById('submitBtn');
        btn.innerText = "Sedang Mengirim...";
        btn.disabled = true;

        const reader = new FileReader();
        reader.onload = function(uploadEvent) {
            const base64String = uploadEvent.target.result.split(',')[1];
            
            const payload = {
                nama: document.getElementById('nama').value,
                email: document.getElementById('email').value,
                hp: document.getElementById('hp').value,
                sosmed: document.getElementById('sosmed').value,
                metodePengambilan: document.getElementById('metodePengambilan').value,
                alamat: document.getElementById('alamat').value || "-",
                detailPesanan: finalDetailStr,
                totalHarga: "Rp " + total.toLocaleString('id-ID'),
                fileName: file.name,
                fileMimeType: file.type,
                fileData: base64String
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    alert(`Berhasil! Pesanan terkirim dengan Nomor Invoice: ${data.invoice}\nCek email kamu untuk rincian invoice.`);
                    window.location.reload();
                } else {
                    alert("Terjadi kesalahan, silakan coba lagi.");
                    btn.innerText = "✨ Kirim Pesanan & Generate Invoice";
                    btn.disabled = false;
                }
            })
            .catch(err => {
                console.error(err);
                alert("Gagal terhubung ke server.");
                btn.innerText = "✨ Kirim Pesanan & Generate Invoice";
                btn.disabled = false;
            });
        }
        reader.readAsDataURL(file);
    });
</script>
</body>

            Total Harga: <span id="totalDisplay">Rp 0</span>
        </div>

        <div class="form-group">
            <label>Upload Bukti Pembayaran (Transfer/QRIS) *</label>
            <input type="file" id="buktiBayar" accept="image/*" required>
        </div>

        <button type="submit" class="btn" id="submitBtn">✨ Kirim Pesanan & Generate Invoice</button>
    </form>
</div>

<script>
    // Ganti dengan URL Web App Google Apps Script kamu
    const SCRIPT_URL = "MASUKKAN_URL_WEB_APP_GOOGLE_SCRIPT_DISINI";

    const qtyInputs = document.querySelectorAll('.item-qty');
    const totalDisplay = document.getElementById('totalDisplay');
    let calculatedTotal = 0;

    qtyInputs.forEach(input => {
        input.addEventListener('input', calculateTotal);
    });

    function calculateTotal() {
        calculatedTotal = 0;
        qtyInputs.forEach(input => {
            const qty = parseInt(input.value) || 0;
            const price = parseInt(input.getAttribute('data-price'));
            calculatedTotal += qty * price;
        });
        totalDisplay.innerText = "Rp " + calculatedTotal.toLocaleString('id-ID');
    }

    document.getElementById('orderForm').addEventListener('submit', function(e) {
        e.preventDefault();

        if (calculatedTotal === 0) {
            alert("Pilih minimal 1 item merchandise terlebih dahulu!");
            return;
        }

        const fileInput = document.getElementById('buktiBayar');
        const file = fileInput.files[0];
        if (!file) {
            alert("Harap upload bukti pembayaran!");
            return;
        }

        // Kumpulkan detail pesanan dari pilihan item + catatan tambahan
        let detailsArr = [];
        qtyInputs.forEach(input => {
            const qty = parseInt(input.value) || 0;
            if (qty > 0) {
                detailsArr.push(`${input.getAttribute('data-name')} (x${qty})`);
            }
        });

        const catatan = document.getElementById('catatanPesanan').value.trim();

        }

        const btn = document.getElementById('submitBtn');
        btn.innerText = "Sedang Mengirim...";
        btn.disabled = true;

        const reader = new FileReader();
        reader.onload = function(uploadEvent) {
            const base64String = uploadEvent.target.result.split(',')[1];
            
            const payload = {
                nama: document.getElementById('nama').value,
                email: document.getElementById('email').value,
                hp: document.getElementById('hp').value,
                sosmed: document.getElementById('sosmed').value,
                metodePengambilan: document.getElementById('metodePengambilan').value,
                alamat: document.getElementById('alamat').value || "-",
                detailPesanan: finalDetailStr,
                totalHarga: "Rp " + calculatedTotal.toLocaleString('id-ID'),
                fileName: file.name,
                fileMimeType: file.type,
                fileData: base64String
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                if(data.status === 'success') {
                    alert(`Berhasil! Pesanan terkirim dengan Nomor Invoice: ${data.invoice}\nCek email kamu untuk rincian invoice.`);
                    window.location.reload();
                } else {
                    alert("Terjadi kesalahan, silakan coba lagi.");
                    btn.innerText = "✨ Kirim Pesanan & Generate Invoice";
                    btn.disabled = false;
                }
            })
            .catch(err => {
                console.error(err);
                alert("Gagal terhubung ke server.");
                btn.innerText = "✨ Kirim Pesanan & Generate Invoice";
                btn.disabled = false;
            });
        };
        reader.readAsDataURL(file);
    });
</script>
</body>
</html>
